services:
  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist_rag_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  streamlit-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist_rag_dashboard
    command: streamlit run src/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fastapi-backend:8000/api/v1/query
      - HEALTH_URL=http://fastapi-backend:8000/health
    depends_on:
      fastapi-backend:
        condition: service_healthy
    restart: unless-stopped