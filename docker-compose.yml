version: '3.8'

services:
  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist_rag_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  streamlit-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist_rag_dashboard
    command: streamlit run src/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fastapi-backend:8000/api/v1/query
      - HEALTH_URL=http://fastapi-backend:8000/health
    depends_on:
      - fastapi-backend
    restart: unless-stopped