[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-challenge-fase4-grupo"
version = "1.0.0"
description = "Plataforma RAG Híbrida e Territorial Intelligence para E-commerce (Olist Voice of Customer)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Equipe FIAP AI Scientist" }
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.9",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0,<3.0.0",
    "plotly>=5.20.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "black>=24.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ['py312']